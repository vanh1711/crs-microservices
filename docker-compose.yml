# path: docker-compose.yml
# purpose: Chay 4 Backend Microservices + 1 Frontend SPA ket noi truc tiep toi MySQL chay ngoai may host (port 3306, password vanh2005)

services:
  auth-service:
    build:
      context: ./auth-service/auth-service
    container_name: crs-auth-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: vanh2005
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8081:8081"

  course-service:
    build:
      context: ./course-service/course-service
    container_name: crs-course-service
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/course_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: vanh2005
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8082:8082"

  registration-service:
    build:
      context: ./registration-service/registration-service
    container_name: crs-registration-service
    restart: unless-stopped
    depends_on:
      - course-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/registration_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: vanh2005
      COURSE_SERVICE_BASE_URL: http://course-service:8082
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
    ports:
      - "8083:8083"

  api-gateway:
    build:
      context: ./api-gateway/api-gateway
    container_name: crs-api-gateway
    restart: unless-stopped
    depends_on:
      - auth-service
      - course-service
      - registration-service
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      REGISTRATION_SERVICE_URL: http://registration-service:8083
      JWT_SECRET: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te
      PARTNER_API_KEY: crs-partner-key-2026
    ports:
      - "8080:8080"

  crs-frontend:
    build:
      context: ./crs-frontend
    container_name: crs-frontend-ui
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5173:80"
